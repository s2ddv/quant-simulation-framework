[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-gbm"
version = "0.1.0"
description = "Single-asset geometric Brownian motion research simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "yfinance",
]

[project.optional-dependencies]
# Linters are pinned so new upstream rules cannot break CI without a review.
dev = ["pytest", "ruff==0.17.6", "mypy==2.4.1"]
notebooks = ["jupyterlab"]
interactive = ["plotly"]
# Offline Streamlit dashboard for saved reports: streamlit run dashboard.py
dashboard = ["streamlit>=1.50", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Project packages live in src/ and are imported as top-level names.
src = ["src", "."]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# "I" (isort) is not selected yet: enabling it reorders/rewraps imports in
# 34 files, a mass style change left for a dedicated commit.
select = ["E", "F", "B", "UP"]
ignore = [
    # The code is not ruff-formatted (no formatter adopted yet); line length
    # is an author style choice and would flag ~300 lines without value.
    "E501",
    # Compact `a; b` statements are used deliberately in a few dense helpers.
    "E702",
    # zip(strict=True) would change runtime behaviour (raise on length
    # mismatch) and strict=False only restates the default; revisit per call.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# The script inserts src/ into sys.path before importing project modules.
"research/reproduce_daily.py" = ["E402"]
# Technical debt: exploratory scripts of the tail-risk study (PR #1) predate
# the lint job and are exempted rather than restyled, so their published
# outputs stay tied to the exact code that produced them. Only the codes that
# occur are listed; library code in src/backtest and src/validation is linted.
"research/tail-risk/*.py" = ["B007", "E401", "E701", "E731", "E741", "F401", "UP031"]

[tool.mypy]
# Non-strict on purpose: bodies of unannotated functions are not checked
# (check_untyped_defs would report ~54 issues, mostly in tests).
python_version = "3.10"
mypy_path = "src"
files = ["src", "main.py", "dashboard.py", "research", "tests"]
# Technical debt: the exploratory tail-risk scripts of PR #1 are not type
# checked (25 errors, mostly untyped dict/list literals). The hyphenated
# directory is not an importable package, so a module override cannot target
# it; the scripts are excluded from discovery instead.
exclude = ['^research/tail-risk/']
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party libraries without bundled type information (plotly and streamlit are optional extras, absent in CI). Stub packages
# (pandas-stubs, scipy-stubs) are not installed, so these resolve to Any.
module = ["pandas.*", "scipy.*", "yfinance.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true
